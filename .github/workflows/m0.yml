name: M0 — GTK + Panama FFM

on:
  push:
    branches: [main, feat/m0-panama-gtk]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'graalvm'
          java-package: jdk

      - name: Install GTK3 + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev xvfb

      - name: Build + unit tests
        run: xvfb-run mvn clean test

      - name: E2E test (window opens and closes)
        run: xvfb-run mvn test -Djauri.e2e=true -Dtest=M0EndToEndTest#windowOpensAndCloses
