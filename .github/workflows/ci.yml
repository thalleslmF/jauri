name: Jauri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'graalvm'
          java-package: jdk

      - name: Install GTK3 + WebKitGTK + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            xvfb

      - name: Build + unit tests
        run: xvfb-run mvn clean test -Djauri.e2e=false

      - name: E2E — M0: window opens and closes
        run: xvfb-run mvn test -Djauri.e2e=true -Dtest=M0EndToEndTest#windowOpensAndCloses

      - name: E2E — M1: WebView loads HTML + JS validation
        run: xvfb-run mvn test -Djauri.e2e=true -Dtest=M1EndToEndTest#webViewLoadsHtmlAndJsReturnsContent
