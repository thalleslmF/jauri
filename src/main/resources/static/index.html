<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jauri Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #c9d1d9;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; flex-direction: column; gap: 1.5rem;
  }
  h1 { color: #58a6ff; font-size: 2rem; }
  .card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 2rem; min-width: 320px;
    text-align: center;
  }
  button {
    background: #238636; color: #fff; border: none;
    padding: 0.75rem 1.5rem; border-radius: 6px;
    font-size: 1rem; cursor: pointer; margin-top: 1rem;
  }
  button:hover { background: #2ea043; }
  #result {
    margin-top: 1rem; padding: 0.75rem;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 4px; font-family: monospace; min-height: 2rem;
  }
  .status { color: #8b949e; font-size: 0.85rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>Jauri ✓</h1>
  <div class="card">
    <p>IPC Bridge — M2</p>
    <button id="pingBtn">Ping Backend</button>
    <div id="result">Click the button</div>
    <div class="status" id="status">WebSocket? No, HTTP!</div>
  </div>
  <script>
    document.getElementById('pingBtn').addEventListener('click', async () => {
      const result = document.getElementById('result');
      result.textContent = 'Pinging...';
      try {
        const res = await fetch('/api/invoke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cmd: 'ping', args: {} })
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
